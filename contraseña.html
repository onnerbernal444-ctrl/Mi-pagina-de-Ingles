<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindset English - Cambiar Contraseña</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabecera de la página -->
    <header>
        <h1>Recuperar cuenta</h1>
        <nav class="nav-buttons">
            <!-- Vínculo para regresar al inicio de sesión -->
            <a href="aquí coloca tu link de vinculo" class="btn">Regresar al Login</a>
        </nav>
    </header>

    <main class="login-container">
        <!-- Tarjeta blanca del formulario -->
        <div class="login-card">
            <h2>¿Olvidaste tu contraseña?</h2>
            <p class="subtitle">Ingresa tu correo electrónico registrado para enviarte un enlace de recuperación o cambiar tu clave.</p>

            <form action="#" method="POST">
                <!-- Campo: Correo Electrónico -->
                <div class="input-group">
                    <label for="recovery-email">Correo Electrónico</label>
                    <input type="email" id="recovery-email" name="recovery-email" placeholder="ejemplo@correo.com" required>
                </div>

                <!-- Botón de enviar instrucciones -->
                <button type="submit" class="btn-submit">Enviar enlace de cambio</button>
            </form>

            <!-- Sección alternativa si recuerda los datos -->
            <div class="register-link">
                <p>¿Recordaste tu contraseña? <a href="aquí coloca tu link de vinculo">Inicia sesión aquí</a></p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; MindsetEnglish44@Gmail.com</p>
        <p>Onner Bernal</p>
    </footer>

</body>
</html>
